<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>✏️ Worksheet Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Controls sidebar (screen only) ──────────────────────────────────── -->
  <aside class="sidebar no-print">
    <h2 class="sidebar-title">✏️ Worksheet Maker</h2>

    <div class="form-group">
      <label for="ws-title-input">📝 Title</label>
      <input type="text" id="ws-title-input" value="⭐ My Worksheet ⭐">
    </div>

    <!-- Math section -->
    <div class="form-section">
      <div class="form-section-title">
        <input type="checkbox" id="math-enabled" checked>
        <label for="math-enabled">🔢 Math</label>
      </div>
      <div id="math-options" class="form-fields">
        <div class="form-row">
          <label for="math-max-right">a+b=＿ &nbsp;max</label>
          <input type="number" id="math-max-right" value="20" min="1" max="99">
        </div>
        <div class="form-row">
          <label for="math-max-left-ans">a+＿=c &nbsp;answer max</label>
          <input type="number" id="math-max-left-ans" value="15" min="1" max="99">
        </div>
        <div class="form-row">
          <label for="math-max-left-stem">a+＿=c &nbsp;numbers max</label>
          <input type="number" id="math-max-left-stem" value="20" min="1" max="99">
        </div>
        <div class="form-row">
          <label for="math-blank-sub-max">＿−n=r &nbsp;max</label>
          <input type="number" id="math-blank-sub-max" value="10" min="3" max="99">
        </div>
        <div class="form-row">
          <label for="math-count">🔢 Questions</label>
          <input type="number" id="math-count" value="8" min="2" max="30">
        </div>
        <div class="form-row" style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e0e0e0;">
          <input type="checkbox" id="symbol-enabled" style="accent-color: #5c6bc0; cursor: pointer;">
          <label for="symbol-enabled" style="cursor: pointer;">Symbol puzzles</label>
        </div>
        <div class="form-row">
          <label for="symbol-count">Count</label>
          <input type="number" id="symbol-count" value="2" min="1" max="10" placeholder="2">
        </div>
        <div class="form-row">
          <label for="symbol-max">Max number</label>
          <input type="number" id="symbol-max" value="4" min="2" max="20" placeholder="4">
        </div>
      </div>
    </div>

    <!-- Alphabet section -->
    <div class="form-section">
      <div class="form-section-title">
        <input type="checkbox" id="alpha-enabled">
        <label for="alpha-enabled">🔤 Alphabet</label>
      </div>
    </div>

    <!-- Cubes section -->
    <div class="form-section">
      <div class="form-section-title">
        <input type="checkbox" id="cube-enabled">
        <label for="cube-enabled">🧊 Cubes</label>
      </div>
      <div id="cube-options" class="form-fields" style="display: none;">
        <div class="form-row">
          <label for="cube-type">Type</label>
          <select id="cube-type">
            <option value="mix" selected>Mix</option>
            <option value="count">Count</option>
            <option value="circle">Circle</option>
            <option value="match">Match</option>
          </select>
        </div>
        <div class="form-row">
          <label for="cube-count">Count</label>
          <input type="number" id="cube-count" value="2" min="1" max="8">
        </div>
        <div class="form-row" style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed #e0e0e0;">
          <input type="checkbox" id="cube-make-enabled" style="accent-color: #00838f; cursor: pointer;">
          <label for="cube-make-enabled" style="cursor: pointer;">Make (build the target)</label>
        </div>
      </div>
    </div>

    <!-- Sentences section -->
    <div class="form-section">
      <div class="form-section-title">
        <input type="checkbox" id="sent-enabled">
        <label for="sent-enabled">📖 Sentences</label>
      </div>
      <div id="sent-options" class="form-fields" style="display: none;">
        <div class="form-row">
          <label for="sent-level">Level up to</label>
          <select id="sent-level">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <div class="form-row">
          <label for="sent-count">Count</label>
          <input type="number" id="sent-count" value="3" min="1" max="12">
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-generate" class="btn-primary">🎲 Shuffle</button>
      <button id="btn-print"    class="btn-secondary">🖨️ Print</button>
    </div>

    <p class="hint">
      <b>a+b=＿</b> · <b>a+＿=c</b> · <b>c−＿=b</b> · <b>＿−a=b</b> · <b>Symbol puzzles</b><br>
      All numbers stay within 20.<br>
      Hit 🎲 for a fresh set!
    </p>
  </aside>

  <!-- ── A4 preview — one .a4-page div per sheet, built by app.js ──────────── -->
  <main class="preview-area" id="pages"></main>

  <script src="sentences.js"></script>
  <script src="cubes.js"></script>
  <script src="app.js"></script>
</body>
</html>
